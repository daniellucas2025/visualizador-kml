<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador Universal de KML / KMZ</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- JSZip para suporte a KMZ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #1e293b;
      --bg-card: #334155;
      --bg-card-hover: #475569;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 1000;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background-color: var(--bg-card-hover);
    }

    .btn-primary {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .file-input-wrapper input[type=file] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .badge-stats {
      display: flex;
      gap: 8px;
      font-size: 12px;
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Main Workspace */
    .main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: 370px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 500;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .file-banner {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #93c5fd;
    }

    .file-banner strong {
      color: #fff;
      font-weight: 600;
      word-break: break-all;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      background-color: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 9px 12px 9px 34px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 13px;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .items-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .items-list::-webkit-scrollbar {
      width: 6px;
    }
    .items-list::-webkit-scrollbar-thumb {
      background: var(--bg-card);
      border-radius: 3px;
    }

    .item-card {
      background-color: rgba(51, 65, 85, 0.45);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-card:hover {
      background-color: rgba(71, 85, 105, 0.7);
      border-color: #64748b;
      transform: translateY(-1px);
    }

    .item-card.active {
      background-color: rgba(59, 130, 246, 0.18);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .item-title {
      font-weight: 600;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
    }

    .point-badge {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      min-width: 24px;
      height: 24px;
      padding: 0 6px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .point-badge.poly {
      background: #ef4444;
    }

    .point-badge.line {
      background: #f59e0b;
    }

    .item-type-tag {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
    }

    .item-summary {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-coords {
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }

    /* Map Container */
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      background: #0b1120;
    }

    /* Dropzone Overlay */
    .drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      border: 4px dashed var(--accent);
      margin: 16px;
      border-radius: 20px;
      pointer-events: none;
    }

    .drop-overlay.active {
      display: flex;
    }

    .drop-overlay h2 {
      font-size: 24px;
      color: #fff;
    }

    /* Custom numbered marker on Map */
    .kml-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2563eb;
      color: #ffffff;
      font-weight: 700;
      font-size: 11px;
      font-family: 'Inter', sans-serif;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.55);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .kml-pin:hover {
      transform: scale(1.22);
      background: #f59e0b;
      z-index: 9999 !important;
    }

    .kml-pin.pin- agro {
      background: #10b981;
    }

    /* Popup Customization */
    .leaflet-popup-content-wrapper {
      background: #1e293b !important;
      color: #f8fafc !important;
      border-radius: 12px !important;
      border: 1px solid #475569;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5) !important;
      padding: 4px;
    }

    .leaflet-popup-tip {
      background: #1e293b !important;
    }

    .leaflet-popup-content {
      margin: 12px 14px !important;
      font-family: 'Inter', sans-serif;
      font-size: 12.5px;
      line-height: 1.5;
      max-height: 320px;
      overflow-y: auto;
    }

    .popup-header {
      font-size: 14px;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .popup-body p {
      margin: 4px 0 !important;
    }

    .popup-footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .popup-link {
      background: #2563eb;
      color: #fff !important;
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .popup-link:hover {
      background: #1d4ed8;
    }

    /* Floating Map Controls */
    .map-floating-bar {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 800;
      display: flex;
      gap: 8px;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(6px);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
    }

    .layer-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .layer-btn.active {
      background: var(--accent);
      color: #fff;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        height: 45%;
      }
    }
  </style>
</head>
<body>

  <!-- Drag and Drop Overlay -->
  <div class="drop-overlay" id="dropOverlay">
    <div style="font-size: 56px;">🗺️</div>
    <h2>Solte seu arquivo .KML ou .KMZ aqui</h2>
    <p style="color: #94a3b8;">O mapa e todos os pontos serão carregados instantaneamente</p>
  </div>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">📍</div>
      <div class="brand-text">
        <h1>Visualizador Universal KML / KMZ</h1>
        <p>Leitor interativo de pontos GPS, rotas, contornos e metadados</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="badge-stats">
        <div class="stat-item"><span class="dot" style="background:#3b82f6"></span> <strong id="countPoints">0</strong> Pontos</div>
        <div class="stat-item"><span class="dot" style="background:#ef4444"></span> <strong id="countLines">0</strong> Contornos/Linhas</div>
      </div>

      <button class="btn" id="btnFitBounds" title="Centralizar todos os elementos na tela">
        🎯 Enquadrar Mapa
      </button>

      <button class="btn" id="btnToggleLabels" title="Mostrar/Ocultar números nos pontos">
        🔢 Rótulos: ON
      </button>

      <div class="file-input-wrapper">
        <button class="btn btn-primary">
          📂 Abrir outro KML / KMZ
        </button>
        <input type="file" id="fileInput" accept=".kml,.kmz,.xml" multiple />
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="main-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="file-banner">
          <span>Arquivo: <strong id="currentFileName">CNEFED_PGEOM_412862505000015.kml</strong></span>
        </div>

        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Buscar por número, fazenda, responsável, código..." />
        </div>

        <div class="filter-tabs">
          <button class="tab-btn active" data-filter="all">Todos (<span id="tabAllCount">0</span>)</button>
          <button class="tab-btn" data-filter="point">Pontos (<span id="tabPointCount">0</span>)</button>
          <button class="tab-btn" data-filter="line">Contornos (<span id="tabLineCount">0</span>)</button>
        </div>
      </div>

      <div class="items-list" id="itemsList"></div>
    </aside>

    <!-- Map -->
    <div id="map">
      <div class="map-floating-bar">
        <button class="layer-btn active" data-layer="hybrid">🛰️ Satélite + Ruas</button>
        <button class="layer-btn" data-layer="satellite">🌎 Satélite Puro</button>
        <button class="layer-btn" data-layer="streets">🗺️ Ruas (Google)</button>
        <button class="layer-btn" data-layer="osm">🧭 OpenStreetMap</button>
        <button class="layer-btn" data-layer="terrain">⛰️ Relevo</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ==========================================
    // 1. INICIALIZAÇÃO DO MAPA E CAMADAS (TILES)
    // ==========================================
    const map = L.map('map', {
      zoomControl: false,
      maxZoom: 21
    }).setView([-23.41, -53.75], 13);

    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

    const tileLayers = {
      hybrid: L.tileLayer('https://mt1.google.com/vt/lyrs=y&hl=pt-BR&x={x}&y={y}&z={z}', {
        maxZoom: 21,
        attribution: '© Google Satellite Hybrid'
      }),
      satellite: L.tileLayer('https://mt1.google.com/vt/lyrs=s&hl=pt-BR&x={x}&y={y}&z={z}', {
        maxZoom: 21,
        attribution: '© Google Satellite'
      }),
      streets: L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=pt-BR&x={x}&y={y}&z={z}', {
        maxZoom: 21,
        attribution: '© Google Maps'
      }),
      osm: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        referrerPolicy: 'origin',
        attribution: '© OpenStreetMap contributors'
      }),
      terrain: L.tileLayer('https://mt1.google.com/vt/lyrs=p&hl=pt-BR&x={x}&y={y}&z={z}', {
        maxZoom: 21,
        attribution: '© Google Terrain'
      })
    };

    let currentBaseLayer = tileLayers.hybrid;
    currentBaseLayer.addTo(map);

    document.querySelectorAll('.layer-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const layerKey = btn.dataset.layer;
        if (currentBaseLayer) map.removeLayer(currentBaseLayer);
        currentBaseLayer = tileLayers[layerKey];
        currentBaseLayer.addTo(map);
      });
    });

    // Grupo principal de elementos KML
    const kmlLayerGroup = L.featureGroup().addTo(map);
    let parsedFeatures = [];
    let showLabels = true;
    let currentFilter = 'all';

    // ==========================================
    // 2. PARSER UNIVERSAL DE KML
    // ==========================================
    function kmlColorToHex(kmlColor) {
      // KML color format: aabbggrr
      if (!kmlColor || kmlColor.length !== 8) return { color: '#ef4444', opacity: 0.9 };
      const aa = parseInt(kmlColor.substring(0, 2), 16) / 255;
      const bb = kmlColor.substring(2, 4);
      const gg = kmlColor.substring(4, 6);
      const rr = kmlColor.substring(6, 8);
      return {
        color: `#${rr}${gg}${bb}`,
        opacity: isNaN(aa) ? 0.9 : Math.max(0.3, aa)
      };
    }

    function parseCoordinatesString(coordText) {
      if (!coordText) return [];
      const tuples = coordText.trim().split(/\s+/);
      const latLngs = [];
      for (const t of tuples) {
        const parts = t.split(',');
        if (parts.length >= 2) {
          const lng = parseFloat(parts[0]);
          const lat = parseFloat(parts[1]);
          if (!isNaN(lat) && !isNaN(lng)) {
            latLngs.push([lat, lng]);
          }
        }
      }
      return latLngs;
    }

    function extractCleanSummary(htmlDescription) {
      if (!htmlDescription) return 'Sem descrição detalhada';
      const tmp = document.createElement('div');
      tmp.innerHTML = htmlDescription;
      // Extract key fields if IBGE/CNEFE format
      const text = tmp.innerText || tmp.textContent || '';
      const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
      const important = lines.filter(l =>
        l.includes('LOCALIDADE:') ||
        l.includes('ENDERECO:') ||
        l.includes('NOME DO RESPONSÁVEL:') ||
        l.includes('NOME DO ESTABELECIMENTO:') ||
        l.includes('ESPÉCIES:') ||
        l.includes('PONTO DE REFERENCIA:')
      );
      if (important.length > 0) {
        return important.slice(0, 3).join(' • ');
      }
      return lines.slice(0, 3).join(' • ') || 'Sem descrição';
    }

    function parseKML(xmlText, fileName = 'Arquivo.kml') {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

      const parserError = xmlDoc.querySelector('parsererror');
      if (parserError) {
        alert('Erro ao interpretar o XML do arquivo KML. Verifique se o arquivo é válido.');
        return;
      }

      kmlLayerGroup.clearLayers();
      parsedFeatures = [];

      // Map global styles
      const styleMap = {};
      xmlDoc.querySelectorAll('Style').forEach(styleEl => {
        const id = styleEl.getAttribute('id');
        if (!id) return;
        const lineColorEl = styleEl.querySelector('LineStyle > color');
        const lineWidthEl = styleEl.querySelector('LineStyle > width');
        const polyColorEl = styleEl.querySelector('PolyStyle > color');
        styleMap['#' + id] = {
          lineColor: lineColorEl ? kmlColorToHex(lineColorEl.textContent.trim()) : null,
          lineWidth: lineWidthEl ? parseFloat(lineWidthEl.textContent.trim()) : 3,
          polyColor: polyColorEl ? kmlColorToHex(polyColorEl.textContent.trim()) : null
        };
      });

      const placemarks = xmlDoc.querySelectorAll('Placemark');
      let featureIndex = 0;

      placemarks.forEach((pm) => {
        const nameEl = pm.querySelector('name');
        const descEl = pm.querySelector('description');
        const name = nameEl ? nameEl.textContent.trim() : `Item ${featureIndex + 1}`;
        let description = descEl ? descEl.textContent.trim() : '';

        // Check ExtendedData if description is empty
        if (!description) {
          const simpleDatas = pm.querySelectorAll('SimpleData, Data');
          if (simpleDatas.length > 0) {
            const rows = [];
            simpleDatas.forEach(d => {
              const k = d.getAttribute('name') || 'Campo';
              const v = d.textContent.trim();
              if (v) rows.push(`<p><b>${k}:</b> ${v}</p>`);
            });
            description = rows.join('');
          }
        }

        // Inline or referenced style
        let strokeColor = '#ef4444';
        let strokeWidth = 3.5;
        let fillColor = '#ef4444';
        let fillOpacity = 0.15;

        const inlineLineColor = pm.querySelector('LineStyle > color');
        const inlineLineWidth = pm.querySelector('LineStyle > width');
        const inlinePolyColor = pm.querySelector('PolyStyle > color');
        const styleUrlEl = pm.querySelector('styleUrl');

        if (styleUrlEl && styleMap[styleUrlEl.textContent.trim()]) {
          const st = styleMap[styleUrlEl.textContent.trim()];
          if (st.lineColor) strokeColor = st.lineColor.color;
          if (st.lineWidth) strokeWidth = st.lineWidth;
          if (st.polyColor) {
            fillColor = st.polyColor.color;
            fillOpacity = st.polyColor.opacity;
          }
        }
        if (inlineLineColor) {
          strokeColor = kmlColorToHex(inlineLineColor.textContent.trim()).color;
        }
        if (inlineLineWidth) {
          strokeWidth = parseFloat(inlineLineWidth.textContent.trim()) || 3.5;
        }
        if (inlinePolyColor) {
          const pc = kmlColorToHex(inlinePolyColor.textContent.trim());
          fillColor = pc.color;
          fillOpacity = pc.opacity;
        }

        // 1. Check Points
        const pointEls = pm.querySelectorAll('Point');
        pointEls.forEach(pt => {
          const coordEl = pt.querySelector('coordinates');
          const coords = parseCoordinatesString(coordEl ? coordEl.textContent : '');
          if (coords.length > 0) {
            const [lat, lng] = coords[0];
            const id = `feat_${featureIndex++}`;

            const shortLabel = name.length <= 4 ? name : '•';
            const icon = L.divIcon({
              className: 'custom-div-icon',
              html: `<div class="kml-pin" style="width:26px;height:26px;">${showLabels ? shortLabel : ''}</div>`,
              iconSize: [26, 26],
              iconAnchor: [13, 13],
              popupAnchor: [0, -13]
            });

            const marker = L.marker([lat, lng], { icon });
            const popupHtml = `
              <div class="popup-header">
                <span>📍 Ponto ${name}</span>
              </div>
              <div class="popup-body">${description || '<p>Sem metadados adicionais.</p>'}</div>
              <div class="popup-footer">
                <a class="popup-link" href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" rel="noopener">
                  🗺️ Abrir no Google Maps
                </a>
              </div>
            `;
            marker.bindPopup(popupHtml, { maxWidth: 360 });
            marker.on('click', () => highlightSidebarCard(id));
            kmlLayerGroup.addLayer(marker);

            parsedFeatures.push({
              id,
              type: 'point',
              name,
              description,
              summary: extractCleanSummary(description),
              lat,
              lng,
              layer: marker
            });
          }
        });

        // 2. Check LineStrings
        const lineEls = pm.querySelectorAll('LineString');
        if (lineEls.length > 0) {
          const multiCoords = [];
          lineEls.forEach(ls => {
            const coordEl = ls.querySelector('coordinates');
            const coords = parseCoordinatesString(coordEl ? coordEl.textContent : '');
            if (coords.length > 0) multiCoords.push(coords);
          });

          if (multiCoords.length > 0) {
            const id = `feat_${featureIndex++}`;
            const polyline = L.polyline(multiCoords, {
              color: strokeColor,
              weight: Math.max(strokeWidth, 3),
              opacity: 0.95
            });

            const center = polyline.getBounds().getCenter();
            const totalVertices = multiCoords.reduce((acc, c) => acc + c.length, 0);
            const popupHtml = `
              <div class="popup-header">
                <span>📐 ${name}</span>
              </div>
              <div class="popup-body">
                ${description ? `<p>${description}</p>` : ''}
                <p><b>Tipo:</b> Linha / Contorno de Setor</p>
                <p><b>Vértices GPS:</b> ${totalVertices} coordenadas</p>
              </div>
            `;
            polyline.bindPopup(popupHtml);
            polyline.on('click', () => highlightSidebarCard(id));
            kmlLayerGroup.addLayer(polyline);

            parsedFeatures.push({
              id,
              type: 'line',
              name,
              description,
              summary: `Contorno geométrico com ${totalVertices} vértices de coordenadas GPS.`,
              lat: center.lat,
              lng: center.lng,
              layer: polyline
            });
          }
        }

        // 3. Check Polygons
        const polyEls = pm.querySelectorAll('Polygon');
        polyEls.forEach(polyEl => {
          const outerEl = polyEl.querySelector('outerBoundaryIs coordinates');
          const coords = parseCoordinatesString(outerEl ? outerEl.textContent : '');
          if (coords.length > 0) {
            const id = `feat_${featureIndex++}`;
            const polygon = L.polygon(coords, {
              color: strokeColor,
              weight: strokeWidth,
              fillColor: fillColor,
              fillOpacity: fillOpacity
            });

            const center = polygon.getBounds().getCenter();
            const popupHtml = `
              <div class="popup-header">
                <span>⬡ ${name}</span>
              </div>
              <div class="popup-body">${description || '<p>Polígono KML</p>'}</div>
            `;
            polygon.bindPopup(popupHtml);
            polygon.on('click', () => highlightSidebarCard(id));
            kmlLayerGroup.addLayer(polygon);

            parsedFeatures.push({
              id,
              type: 'line',
              name,
              description,
              summary: extractCleanSummary(description) || `Polígono com ${coords.length} vértices.`,
              lat: center.lat,
              lng: center.lng,
              layer: polygon
            });
          }
        });
      });

      document.getElementById('currentFileName').textContent = fileName;
      updateStatsAndList();

      if (kmlLayerGroup.getLayers().length > 0) {
        map.fitBounds(kmlLayerGroup.getBounds(), { padding: [36, 36] });
      }
    }

    // ==========================================
    // 3. RENDERIZAÇÃO DA BARRA LATERAL E BUSCA
    // ==========================================
    function updateStatsAndList() {
      const pointsCount = parsedFeatures.filter(f => f.type === 'point').length;
      const linesCount = parsedFeatures.filter(f => f.type === 'line').length;

      document.getElementById('countPoints').textContent = pointsCount;
      document.getElementById('countLines').textContent = linesCount;
      document.getElementById('tabAllCount').textContent = parsedFeatures.length;
      document.getElementById('tabPointCount').textContent = pointsCount;
      document.getElementById('tabLineCount').textContent = linesCount;

      renderSidebarList();
    }

    function renderSidebarList() {
      const listEl = document.getElementById('itemsList');
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      listEl.innerHTML = '';

      const filtered = parsedFeatures.filter(item => {
        if (currentFilter !== 'all' && item.type !== currentFilter) return false;
        if (!query) return true;
        const haystack = `${item.name} ${item.summary} ${item.description}`.toLowerCase();
        return haystack.includes(query);
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div style="text-align:center; padding: 32px 16px; color: var(--text-muted); font-size: 13px;">
            Nenhum ponto ou geometria encontrada para a busca atual.
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.id = `card_${item.id}`;

        const isPoint = item.type === 'point';
        const badgeClass = isPoint ? '' : 'poly';
        const badgeText = isPoint ? item.name : '📐';
        const titleText = isPoint ? `Ponto #${item.name}` : item.name;
        const typeLabel = isPoint ? 'Ponto GPS' : 'Contorno / Área';

        card.innerHTML = `
          <div class="item-top">
            <div class="item-title">
              <span class="point-badge ${badgeClass}">${badgeText}</span>
              <span>${titleText}</span>
            </div>
            <span class="item-type-tag">${typeLabel}</span>
          </div>
          <div class="item-summary">${item.summary}</div>
          <div class="item-coords">
            <span>Lat: ${item.lat.toFixed(6)}, Lng: ${item.lng.toFixed(6)}</span>
            <span style="color:#60a5fa; font-weight:600;">Ver no mapa →</span>
          </div>
        `;

        card.addEventListener('click', () => {
          highlightSidebarCard(item.id);
          if (item.type === 'point') {
            map.flyTo([item.lat, item.lng], Math.max(map.getZoom(), 17), { duration: 0.6 });
            item.layer.openPopup();
          } else if (item.layer.getBounds) {
            map.fitBounds(item.layer.getBounds(), { padding: [40, 40] });
            item.layer.openPopup();
          }
        });

        listEl.appendChild(card);
      });
    }

    function highlightSidebarCard(featureId) {
      document.querySelectorAll('.item-card.active').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(`card_${featureId}`);
      if (target) {
        target.classList.add('active');
        target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // ==========================================
    // 4. EVENTOS DE INTERFACE E UPLOAD DE ARQUIVOS
    // ==========================================
    document.getElementById('searchInput').addEventListener('input', renderSidebarList);

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderSidebarList();
      });
    });

    document.getElementById('btnFitBounds').addEventListener('click', () => {
      if (kmlLayerGroup.getLayers().length > 0) {
        map.fitBounds(kmlLayerGroup.getBounds(), { padding: [36, 36] });
      }
    });

    document.getElementById('btnToggleLabels').addEventListener('click', (e) => {
      showLabels = !showLabels;
      e.currentTarget.textContent = showLabels ? '🔢 Rótulos: ON' : '🔢 Rótulos: OFF';
      parsedFeatures.forEach(f => {
        if (f.type === 'point') {
          const shortLabel = f.name.length <= 4 ? f.name : '•';
          const newIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div class="kml-pin" style="width:26px;height:26px;">${showLabels ? shortLabel : ''}</div>`,
            iconSize: [26, 26],
            iconAnchor: [13, 13],
            popupAnchor: [0, -13]
          });
          f.layer.setIcon(newIcon);
        }
      });
    });

    async function handleFileLoad(file) {
      if (!file) return;
      const ext = file.name.toLowerCase();
      try {
        if (ext.endsWith('.kmz')) {
          const zip = await JSZip.loadAsync(file);
          const kmlFile = Object.keys(zip.files).find(name => name.toLowerCase().endsWith('.kml'));
          if (!kmlFile) {
            alert('Nenhum arquivo .kml encontrado dentro deste arquivo .kmz.');
            return;
          }
          const kmlText = await zip.files[kmlFile].async('string');
          parseKML(kmlText, file.name);
        } else {
          const text = await file.text();
          parseKML(text, file.name);
        }
      } catch (err) {
        console.error(err);
        alert('Erro ao ler o arquivo: ' + err.message);
      }
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleFileLoad(e.target.files[0]);
      }
    });

    // Drag and Drop em qualquer lugar da janela
    const dropOverlay = document.getElementById('dropOverlay');
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropOverlay.classList.add('active');
    });
    window.addEventListener('dragleave', (e) => {
      if (e.relatedTarget === null) {
        dropOverlay.classList.remove('active');
      }
    });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.classList.remove('active');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFileLoad(e.dataTransfer.files[0]);
